name: Update Profile README

on:
  schedule:
    # Run daily at 11:00 PM IST (5:30 PM UTC) — end of day summary
    - cron: '30 17 * * *'
  workflow_dispatch:
    # Manual trigger for testing
  push:
    branches: [main]
    paths:
      - 'scripts/update-readme.mjs'
      - '.github/workflows/update-profile.yml'

permissions:
  contents: write

concurrency:
  group: update-profile-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Update README
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: node scripts/update-readme.mjs

      - name: Commit and push
        run: |
          git config user.name "arjundroid12-bot"
          git config user.email "arjunvashishtha2004@gmail.com"

          git add README.md
          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          TODAY=$(TZ='Asia/Kolkata' date +%Y-%m-%d)
          git commit -m "chore: auto-update profile README with live stats ($TODAY)

          Generated by scripts/update-readme.mjs via GitHub Actions.
          - Updates repo count, stars, followers
          - Refreshes top-languages breakdown
          - Pulls in top 6 pinned repos by stars/recency
          - Lists 5 most recent commits"

          git push
          echo "✅ Pushed profile README update"
